name: Release Lyra Standalone Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
        matrix:
          include:
            - os: macos-latest
              target: darwin-arm64
              binary_name: lyra-darwin-arm64
            - os: ubuntu-latest
              target: linux-x64
              binary_name: lyra-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Compile standalone binary
        if: matrix.target != 'linux-x64'
        run: |
          mkdir -p dist
          bun build --compile --minify --production packages/tui/bin/lyra-tui.ts --define 'process.env.LYRA_VERSION=${{ toJSON(github.event.release.tag_name || inputs.tag_name || github.ref_name) }}' --outfile dist/${{ matrix.binary_name }}

      - name: Compile Linux standalone binary
        if: matrix.target == 'linux-x64'
        run: |
          mkdir -p dist
          bun build --compile --minify --production packages/tui/bin/lyra-tui.ts --define 'process.env.LYRA_VERSION=${{ toJSON(github.event.release.tag_name || inputs.tag_name || github.ref_name) }}' --define 'process.env.OPENTUI_LIBC="glibc"' --outfile dist/${{ matrix.binary_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: dist
        run: |
          sha256sum lyra-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
